<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SupeRR Selector | Pressure Performance Lab</title>
<style>
body{font:16px system-ui,sans-serif;background:#101b33;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
main{max-width:560px;padding:32px;text-align:center}
p{color:#cbd5e1}
</style>
</head>
<body>
<main><h1>SupeRR Pressure Performance Lab</h1><p id="status">Loading dashboard…</p></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const response=await fetch('./dashboard.html.gz.b64');
    if(!response.ok) throw new Error('Dashboard source could not be loaded.');
    const encoded=(await response.text()).trim();
    const binary=atob(encoded);
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(error){status.textContent='Unable to load dashboard: '+error.message;}
})();
</script>
</body>
</html>
