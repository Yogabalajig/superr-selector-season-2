name: Deploy pressure performance dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build dashboard HTML
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = Path("dashboard.html.gz.b64").read_bytes()
          html = gzip.decompress(base64.b64decode(encoded))
          Path("index.html").write_bytes(html)
          print(f"Built index.html ({len(html):,} bytes)")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
